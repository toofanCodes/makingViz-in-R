name: build-and-deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Check R installation
        run: |
          echo "Should see R path below:"
          which R || { echo "R not found"; exit 1; }
          which Rscript || { echo "Rscript not found"; exit 1; }
          Rscript -e "R.version.string"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages("tidyverse", repos = "https://cloud.r-project.org")'
          Rscript -e 'if (!require("quarto")) install.packages("quarto", repos = "https://cloud.r-project.org")'

      - name: Render Quarto project
        run: quarto render .

      - name: Show output directory
        run: ls -l _site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
