name: Publish Quarto Website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This permission is required to push to the gh-pages branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Website
        # This command renders your Quarto project into the default '_site' directory
        run: quarto render

      - name: Deploy to GitHub Pages
        # This action takes the files from the render step and deploys them to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # This is the directory that Quarto rendered the website to
          publish_dir: ./_site
