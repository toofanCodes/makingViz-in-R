name: r-only-setup

on:
  push:
    branches: [main]

jobs:
  setup-r:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Confirm R installation
        run: |
          which R
          which Rscript
          Rscript -e "R.version.string"
